[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-memory"
version = "0.1.0"
description = "A local AI memory system for university lecture materials."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Lecture Memory contributors" },
]
dependencies = [
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*", "benchmark*", "frontend*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
