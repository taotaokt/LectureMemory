[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-memory"
version = "0.1.0"
description = "A local AI memory system for university lecture materials."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Lecture Memory contributors" },
]
dependencies = [
    "numpy>=1.26,<3",
    "pydantic-settings>=2.5,<3",
    "PyMuPDF>=1.24,<2",
    "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
    "ruff>=0.6",
]
qwen = [
    "accelerate>=1.12,<2",
    "pillow>=10,<13",
    "qwen-vl-utils>=0.0.14,<0.1",
    "torch==2.8.*",
    "torchvision>=0.23,<0.24",
    "transformers>=4.57.3,<5",
]

[tool.setuptools.packages.find]
include = ["app*", "benchmark*", "frontend*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
